# Standalone workflow; not generated by src.main.kts.
name: Audio Runtime
run-name: Audio runtime ${{ inputs.version }} (publish=${{ inputs.publish }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Maven version (for example 0.3.1-audio-SNAPSHOT)
        type: string
        required: true
        default: 0.3.1-audio-SNAPSHOT
      publish:
        description: Publish all platform runtimes and the aggregator to private Maven
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: audio-runtime-${{ inputs.version }}
  cancel-in-progress: false

env:
  RUNTIME_VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate version and optional publishing credentials
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
          MAVEN_USERNAME: ${{ secrets.ORG_GRADLE_PROJECT_privateMavenUsername }}
          MAVEN_PASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_privateMavenPassword }}
        run: |
          if [[ ! "$RUNTIME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            echo "::error::Use a version such as 0.3.1-audio-SNAPSHOT or 0.3.1-audio.1."
            exit 1
          fi
          if [[ "$PUBLISH" == true && ( -z "$MAVEN_USERNAME" || -z "$MAVEN_PASSWORD" ) ]]; then
            echo "::error::Set ORG_GRADLE_PROJECT_privateMavenUsername and ORG_GRADLE_PROJECT_privateMavenPassword in repository Actions secrets."
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            family: windows
            target: WindowsX64
            msystem: UCRT64
            package-prefix: mingw-w64-ucrt-x86_64
            compiler: gcc
          - platform: windows-arm64
            runner: windows-11-arm
            family: windows
            target: WindowsArm64
            msystem: CLANGARM64
            package-prefix: mingw-w64-clang-aarch64
            compiler: clang
          - platform: macos-x64
            runner: macos-15-intel
            family: macos
            target: MacosX64
          - platform: macos-arm64
            runner: macos-15
            family: macos
            target: MacosArm64
          - platform: linux-x64
            runner: ubuntu-24.04
            family: linux
            target: LinuxX64
    env:
      RUNTIME_PLATFORM: ${{ matrix.platform }}
      RUNTIME_FAMILY: ${{ matrix.family }}
      RUNTIME_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      # buildSrc requires JDK 17; native packaging does not compile the JVM wrapper.
      # Microsoft supplies native Windows ARM64 JDKs as well as the other targets.
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Windows native toolchain
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git make diffutils pkg-config
            ${{ matrix.package-prefix }}-${{ matrix.compiler }}
            ${{ matrix.platform == 'windows-arm64' && 'mingw-w64-clang-aarch64-lld' || '' }}
            ${{ matrix.package-prefix }}-nasm
            ${{ matrix.package-prefix }}-openssl
            ${{ matrix.package-prefix }}-ca-certificates
            ${{ matrix.package-prefix }}-libass
            ${{ matrix.package-prefix }}-libplacebo
            ${{ matrix.package-prefix }}-meson
            ${{ matrix.package-prefix }}-ninja
            ${{ matrix.package-prefix }}-pkgconf
            ${{ matrix.package-prefix }}-python
            ${{ matrix.package-prefix }}-python-certifi
            ${{ matrix.package-prefix }}-shaderc
            ${{ matrix.package-prefix }}-spirv-cross

      - name: Configure Windows toolchain path
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $msys2Dir = $env:MSYS2_LOCATION.Replace('\', '/')
          "msys2.dir=$msys2Dir" | Out-File -FilePath local.properties -Encoding ascii -Append

      - name: Install macOS native toolchain
        if: runner.os == 'macOS'
        run: brew install nasm meson ninja pkg-config libass libplacebo

      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        run: |
          bash ci-helper/install-ffmpeg-deps-ubuntu.sh
          bash ci-helper/install-mpv-deps-ubuntu.sh
          sudo apt-get install -y --no-install-recommends libssl-dev

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build MPV runtime (including its FFmpeg libraries)
        run: |
          bash ./gradlew ":mediamp-mpv:mpvRuntimeJar$RUNTIME_TARGET" \
            "-Pversion.name=$RUNTIME_VERSION" \
            "-Pmediamp.ffmpeg.buildvariant=$RUNTIME_FAMILY" \
            "-Pmediamp.mpv.buildvariant=$RUNTIME_FAMILY" \
            -Pkotlin.native.ignoreDisabledTargets=true \
            --no-configuration-cache --console=plain

      - name: Verify runtime JAR contents
        run: |
          python ci-helper/verify-mpv-runtime.py \
            "mediamp-mpv/build/libs/mediamp-mpv-runtime-$RUNTIME_VERSION-$RUNTIME_PLATFORM.jar" \
            "$RUNTIME_PLATFORM"

      - name: Upload runtime JAR
        uses: actions/upload-artifact@v4
        with:
          name: mediamp-mpv-runtime-${{ matrix.platform }}
          path: mediamp-mpv/build/libs/mediamp-mpv-runtime-${{ inputs.version }}-${{ matrix.platform }}.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish runtimes to private Maven
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Download all platform JARs
        uses: actions/download-artifact@v4
        with:
          pattern: mediamp-mpv-runtime-*
          path: mediamp-mpv/build/downloaded-runtime-jars

      - name: Verify and stage all five platforms
        run: |
          for platform in windows-x64 windows-arm64 macos-x64 macos-arm64 linux-x64; do
            jar_name="mediamp-mpv-runtime-$RUNTIME_VERSION-$platform.jar"
            source="mediamp-mpv/build/downloaded-runtime-jars/mediamp-mpv-runtime-$platform/$jar_name"
            python ci-helper/verify-mpv-runtime.py "$source" "$platform"
            destination="mediamp-mpv/build/prebuilt-runtime-jars/$platform"
            mkdir -p "$destination"
            cp "$source" "$destination/$jar_name"
          done

      # Empty buildvariant selections make this job consume only prebuilt JARs.
      # Publish once, after all platforms succeed, so the aggregator is complete.
      - name: Publish platform runtimes and aggregator
        env:
          ORG_GRADLE_PROJECT_privateMavenUsername: ${{ secrets.ORG_GRADLE_PROJECT_privateMavenUsername }}
          ORG_GRADLE_PROJECT_privateMavenPassword: ${{ secrets.ORG_GRADLE_PROJECT_privateMavenPassword }}
        run: |
          bash ./gradlew :mediamp-mpv:publishMpvRuntimeToPrivateMaven \
            "-Pversion.name=$RUNTIME_VERSION" \
            -Pmediamp.ffmpeg.buildvariant= \
            -Pmediamp.mpv.buildvariant= \
            -Pkotlin.native.ignoreDisabledTargets=true \
            --no-configuration-cache --console=plain

      - name: Summarize publication
        run: |
          {
            echo '### Published MPV audio runtimes'
            echo "Version: $RUNTIME_VERSION"
            echo
            echo "\`com.caij.lib.mediamp.audio:mediamp-mpv-runtime:$RUNTIME_VERSION\`"
            echo
            echo 'Platforms: Windows x64/ARM64, macOS x64/ARM64, Linux x64.'
          } >> "$GITHUB_STEP_SUMMARY"
